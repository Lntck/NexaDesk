# Static SPA with an API proxy: the client calls relative /api and /health
# paths, so the refresh cookie stays same-origin. The upstream host is the
# backend service name in the compose network.

# Access events go to stdout as one JSON line, field names aligned with the
# backend logging schema so both services can be queried together.
map $status $log_level {
    ~^5 ERROR;
    ~^4 WARNING;
    default INFO;
}

map $status $severity_number {
    ~^5 17;
    ~^4 13;
    default 9;
}

log_format json_access escape=json
    '{"timestamp":"$time_iso8601",'
    '"level":"$log_level",'
    '"severity_number":$severity_number,'
    '"message":"$request_method $uri",'
    '"service.name":"nexadesk-frontend",'
    '"k8s.pod.name":"$hostname",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status_code":$status,'
    '"duration_s":$request_time,'
    '"upstream_duration_s":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent,'
    '"remote_addr":"$remote_addr",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$request_id"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_access;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Backend API. The SSE event stream must not be buffered.
    location /api/ {
        gzip off;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        access_log off;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    # Liveness target for the container: nginx itself, not the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the entry point.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
