backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/nexadesk/backend
    tag: v1.3.1
  podAnnotations: {
      prometheus.io/scrape: "true",
      prometheus.io/port: "9100",
      prometheus.io/path: "/metrics",
  }

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/nexadesk/frontend
    tag: v1.1.0

config:
  dbHost: nexadesk-db-postgresql
  dbPort: "5432"
  dbName: nexadesk
  redisHost: nexadesk-redis-master
  redisPort: "6379"
  redisDb: 0
  accessTokenExpireM: 15
  refreshTokenExpireM: 43200
  cookieSecure: "false"
  cookieSameSite: "strict"
  corsOrigins: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:3000","http://127.0.0.1:3000"]'
  debug: "false"
  environment: "dev"
  logLevel: "INFO"
  sseHeartbeatS: 15
  sseIdleTimeoutS: 300
  sseMaxQueuedEvents: 10000
  sseReplayLimit: 500
  metricsEnabled: "true"
  metricsHost: "0.0.0.0"
  metricsPort: 9100
