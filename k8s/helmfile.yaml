repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: nexadesk-db
    namespace: nexadesk
    chart: bitnami/postgresql
    version: 18.12.14
    values:
      - environments/dev/postgres-values.yaml
    wait: true
    timeout: 300
    atomic: true

  - name: nexadesk-redis
    namespace: nexadesk
    chart: bitnami/redis
    version: 28.3.0
    values:
      - environments/dev/redis-values.yaml
    wait: true
    timeout: 300
    atomic: true

  - name: nexadesk-app
    namespace: nexadesk
    chart: ./charts/nexadesk-app
    values:
      - environments/dev/app-values.yaml
    needs:
      - nexadesk/nexadesk-db
      - nexadesk/nexadesk-redis
    wait: true
    timeout: 600
    atomic: true
