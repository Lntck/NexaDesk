apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: config
data:
  # PostgreSQL
  POSTGRES_DB: "nexadesk"
  POSTGRES_USER: "nexadesk"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # Token lifetimes
  ACCESS_TOKEN_EXPIRE_M: "15"
  REFRESH_TOKEN_EXPIRE_M: "43200"

  # Cookies
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "strict"

  # CORS
  CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:3000","http://127.0.0.1:3000"]'

  # FastAPI
  DEBUG: "false"

  # Realtime (SSE)
  SSE_HEARTBEAT_S: "15"
  SSE_IDLE_TIMEOUT_S: "300"
  SSE_MAX_QUEUED_EVENTS: "10000"
  SSE_REPLAY_LIMIT: "500"
