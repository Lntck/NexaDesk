apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: logging
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: monitoring
data:
  nexadesk-logs.yaml: |
    groups:
      - name: nexadesk-logs
        type: vlogs
        interval: 1m
        rules:
          - alert: DbRoleErrors
            expr: 'kubernetes.pod_namespace:nexadesk AND kubernetes.pod_name:db-0 AND _msg:root AND _msg:does | stats count() as errors | filter errors:>5'
            labels:
              severity: warning
            annotations:
              description: 'Postgres reports missing role on db-0: {{ $value }} occurrences in the last minute'
          - alert: BackendErrors
            expr: 'service.name:nexadesk-backend AND level:ERROR | stats by (kubernetes.pod_name) count() as errors | filter errors:>0'
            labels:
              severity: warning
            annotations:
              description: 'Error logs from {{ index .Labels "kubernetes.pod_name" }}: {{ $value }} in the last minute'
