apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
  namespace: logging
  labels:
    app.kubernetes.io/name: vlagent
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlagent
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: vlagent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:v1.53.0
          args:
            - "-kubernetesCollector"
            - "-remoteWrite.url=http://victorialogs.logging.svc.cluster.local:9428/insert/native"
            - "-tmpDataPath=/var/lib/vlagent"
            - "-remoteWrite.maxDiskUsagePerURL=2097152000"
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: dockerlogs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: buffer
              mountPath: /var/lib/vlagent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: dockerlogs
          hostPath:
            path: /var/lib/docker/containers
        - name: buffer
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      tolerations:
        - operator: Exists
