apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
  namespace: logging
  labels:
    app.kubernetes.io/name: vlagent
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlagent
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: vlagent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:v1.53.0
          args:
            - "-remoteWrite.url=http://victorialogs.logging.svc.cluster.local:9428/insert/native"
            - "-remoteWrite.tmpDataPath=/vlagent-buffer"
            - "-kubernetesCollector"
            - "-kubernetesCollector.checkpointsPath=/vlagent-buffer/checkpoints.json"
          securityContext:
            capabilities:
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: buffer
              mountPath: /vlagent-buffer
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: buffer
          emptyDir: {}
      tolerations:
        - effect: NoSchedule
          operator: Exists
