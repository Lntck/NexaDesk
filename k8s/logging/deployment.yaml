apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: logging
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/component: server
    spec:
      containers:
      - name: victorialogs
        image: victoriametrics/victoria-logs:v1.53.0
        args:
          - "-storageDataPath=/var/lib/victoria-logs"
          - "-retentionPeriod=30d"
          - "-httpListenAddr=:9428"
        ports:
          - name: http
            containerPort: 9428
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
          - name: data
            mountPath: /var/lib/victoria-logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victorialogs-data
