apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexadesk-prober
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk-prober
    app.kubernetes.io/component: prober
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexadesk-prober
      app.kubernetes.io/component: prober
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9102
