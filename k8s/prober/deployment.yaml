apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexadesk-prober
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk-prober
    app.kubernetes.io/component: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk-prober
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk-prober
        app.kubernetes.io/component: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prober
          image: ghcr.io/nexadesk/prober:v0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PROBE_TARGET_URL
              value: "http://backend:8000"
            - name: PROBE_PROJECT_KEY
              value: "PROBE"
            - name: PROBE_INTERVAL_S
              value: "30"
            - name: PROBE_TIMEOUT_S
              value: "10"
            - name: PROBE_METRICS_PORT
              value: "9102"
            - name: PROBE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: prober-secrets
                  key: PROBE_EMAIL
            - name: PROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prober-secrets
                  key: PROBE_PASSWORD
            - name: PROBE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: prober-secrets
                  key: PROBE_USERNAME
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9102
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 20
