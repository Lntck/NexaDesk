apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: api-routing
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexadesk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: "0s"
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /health
      timeouts:
        request: "0s"
      backendRefs:
        - name: backend
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: web-routing
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexadesk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
