apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.envConfigMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}

  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_DB: {{ .Values.config.redisDb | default 0 | quote }}

  ACCESS_TOKEN_EXPIRE_M: {{ .Values.config.accessTokenExpireM | default 15 | quote }}
  REFRESH_TOKEN_EXPIRE_M: {{ .Values.config.refreshTokenExpireM | default 43200 | quote }}

  COOKIE_SECURE: {{ .Values.config.cookieSecure | default "false" | quote }}
  COOKIE_SAMESITE: {{ .Values.config.cookieSameSite | default "strict" | quote }}

  CORS_ORIGINS: {{ .Values.config.corsOrigins | default "[]" | quote }}

  DEBUG: {{ .Values.config.debug | default "false" | quote }}

  DEPLOYMENT_ENVIRONMENT_NAME: {{ .Values.config.environment | default "dev" | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | default "INFO" | quote }}

  SSE_HEARTBEAT_S: {{ .Values.config.sseHeartbeatS | default 15 | quote }}
  SSE_IDLE_TIMEOUT_S: {{ .Values.config.sseIdleTimeoutS | default 300 | quote }}
  SSE_MAX_QUEUED_EVENTS: {{ .Values.config.sseMaxQueuedEvents | default 10000 | quote }}
  SSE_REPLAY_LIMIT: {{ .Values.config.sseReplayLimit | default 500 | quote }}
