apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
    receivers:
      - name: default
