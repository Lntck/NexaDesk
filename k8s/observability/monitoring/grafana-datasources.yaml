apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: ui
data:
  victoria-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.observability.svc:8428
        isDefault: true

      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victorialogs.observability.svc:9428
        isDefault: false
        jsonData:
          maxLines: 1000
          logLevelRules:
            - field: level
              operator: equals
              value: ERROR
              level: error
              enabled: true
            - field: level
              operator: equals
              value: WARNING
              level: warning
              enabled: true
            - field: level
              operator: equals
              value: INFO
              level: info
              enabled: true
