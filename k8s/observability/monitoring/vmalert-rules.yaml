apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: alerting
data:
  nexadesk-logs.yaml: |
    groups:
      - name: nexadesk-logs
        type: vlogs
        interval: 1m
        rules:
          - alert: DbRoleErrors
            expr: 'kubernetes.pod_namespace:nexadesk AND kubernetes.pod_name:nexadesk-db-postgresql-* AND _msg:root AND _msg:does | stats by (kubernetes.pod_name) count() as errors | filter errors:>5'
            for: 2m
            labels:
              severity: warning
              service: nexadesk-db
            annotations:
              summary: 'NexaDesk: PostgreSQL reports a missing role'
              description: 'Postgres reports missing role on {{ index .Labels "kubernetes.pod_name" }}: {{ $value }} occurrences in the last minute'
