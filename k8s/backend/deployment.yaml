apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: backend
spec:
  replicas : 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-migrations
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              log() {
                printf '{"timestamp":"%s","level":"%s","message":"%s","service.name":"nexadesk-backend","component":"wait-for-migrations"}\n' "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" "$1" "$2"
              }
              attempts=0
              max_attempts=200
              head="${EXPECTED_REVISION:-$(alembic heads 2>/dev/null | head -n1 | awk '{print $1}')}"
              log INFO "target revision: $head"
              while true; do
                current=$(alembic current 2>/dev/null | awk '{print $1}')
                if [ -n "$head" ] && [ "$current" = "$head" ]; then
                  log INFO "schema at $current, starting backend"
                  exit 0
                fi
                attempts=$((attempts + 1))
                if [ "$attempts" -ge "$max_attempts" ]; then
                  log ERROR "deadline exceeded: current=${current:-none}, target=$head"
                  exit 1
                fi
                log INFO "current=${current:-none}, waiting for $head"
                sleep 3
              done
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
      containers:
        - name: backend
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
