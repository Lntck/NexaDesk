apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: backend
spec:
  replicas : 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-migrations
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
                echo "waiting for migrations to reach head..."
                until alembic current 2>/dev/null | grep -q "(head)";
                do
                  sleep 3
                done
                echo "migrations applied, starting backend"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
      containers:
        - name: backend
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
