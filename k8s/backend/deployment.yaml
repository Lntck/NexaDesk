apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: backend
spec:
  replicas : 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-migrations
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              attempts=0
              max_attempts=200
              head="${EXPECTED_REVISION:-$(alembic heads 2>/dev/null | head -n1 | awk '{print $1}')}"
              echo "[wait-for-migrations] target revision: $head"
              while true; do
                current=$(alembic current 2>/dev/null | awk '{print $1}')
                if [ -n "$head" ] && [ "$current" = "$head" ]; then
                  echo "[wait-for-migrations] schema at $current, starting backend"
                  exit 0
                fi
                attempts=$((attempts + 1))
                if [ "$attempts" -ge "$max_attempts" ]; then
                  echo "[wait-for-migrations] deadline exceeded: current=${current:-none}, target=$head" >&2
                  exit 1
                fi
                echo "[wait-for-migrations] current=${current:-none}, waiting for $head"
                sleep 3
              done
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
      containers:
        - name: backend
          image: nexadesk-backend:v1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
