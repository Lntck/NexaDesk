# Shadow routing: users are served by stable (v1.3.1); a 100% copy of every
# /api request is mirrored to the shadow Deployment (v1.4.0).
#
# The mirror filter is placed after the backend target is resolved, so the
# mirrored request keeps the original path and headers. SSE and /health are
# not mirrored.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: api-routing
    app.kubernetes.io/part-of: nexadesk
    strategy: shadow
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexadesk
  rules:
    - name: sse
      matches:
        - path:
            type: RegularExpression
            value: "^/api/v1/projects/[0-9]+/events/?$"
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - name: backend-shadow-stable
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /health
      timeouts:
        request: "30s"
      backendRefs:
        - name: backend-shadow-stable
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: "30s"
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: backend-shadow-mirror
              port: 8000
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Deployment
                value: shadow-stable
      backendRefs:
        - name: backend-shadow-stable
          port: 8000
