# Shadow demo: every /api request is served by stable (v1.3.1) and a copy is
# mirrored to shadow (v1.4.0). The mirrored response is ignored, so a broken
# new version cannot affect user traffic. SSE and /health are not mirrored.
#
# Shadow copies writes, so short runs are recommended: duplicate tasks and
# comments created by the mirror are expected.
apiVersion: v1
kind: Service
metadata:
  name: backend-shadow-stable
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk-strategy
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexadesk
    strategy: shadow
    track: stable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexadesk-strategy
    app.kubernetes.io/component: backend
    strategy: shadow
    track: stable
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-shadow-stable
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk-strategy
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexadesk
    strategy: shadow
    track: stable
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk-strategy
      app.kubernetes.io/component: backend
      strategy: shadow
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk-strategy
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nexadesk
        strategy: shadow
        track: stable
        version: "1.3.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/nexadesk/backend:v1.3.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_VERSION
              value: "1.3.1"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
