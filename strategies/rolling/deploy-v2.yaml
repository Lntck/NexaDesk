# New version for the rolling update.
#
# The Deployment name, selector and labels stay the same as in base.yaml; only
# the image, SERVICE_VERSION and the pod version label change. Applying this
# file is the whole update: Kubernetes performs the rolling replacement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rolling
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk-strategy
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexadesk
    strategy: rolling
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexadesk-strategy
      app.kubernetes.io/component: backend
      strategy: rolling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexadesk-strategy
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nexadesk
        strategy: rolling
        track: new
        version: "1.4.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/nexadesk/backend:v1.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_VERSION
              value: "1.4.0"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
