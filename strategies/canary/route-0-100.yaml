# Canary step 3: 100% of /api traffic to canary (v1.4.0). SSE and /health stay
# on stable so open browser streams keep working. This is the promotion step;
# the old Deployment can be scaled down or deleted afterwards.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: api-routing
    app.kubernetes.io/part-of: nexadesk
    strategy: canary
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexadesk
  rules:
    - name: sse
      matches:
        - path:
            type: RegularExpression
            value: "^/api/v1/projects/[0-9]+/events/?$"
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - name: backend-canary-stable
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /health
      timeouts:
        request: "30s"
      backendRefs:
        - name: backend-canary-stable
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: "30s"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Deployment
                value: canary-0-100
      backendRefs:
        - name: backend-canary-new
          port: 8000
          weight: 100
