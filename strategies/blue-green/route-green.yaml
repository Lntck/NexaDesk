# Blue/Green switch: all traffic goes to the green Deployment (v1.4.0).
# The switch is instant: one HTTPRoute update, no pod restarts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: nexadesk
  labels:
    app.kubernetes.io/name: nexadesk
    app.kubernetes.io/component: api-routing
    app.kubernetes.io/part-of: nexadesk
    strategy: blue-green
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexadesk
  rules:
    - name: sse
      matches:
        - path:
            type: RegularExpression
            value: "^/api/v1/projects/[0-9]+/events/?$"
      timeouts:
        request: "0s"
        backendRequest: "0s"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Deployment
                value: blue-green-green
      backendRefs:
        - name: backend-green
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /health
      timeouts:
        request: "30s"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Deployment
                value: blue-green-green
      backendRefs:
        - name: backend-green
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: "30s"
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Deployment
                value: blue-green-green
      backendRefs:
        - name: backend-green
          port: 8000
